{% extends 'base.html' %}

{% block title %}Удалить запись?{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center">Вы уверены, что хотите удалить "{{ object.title }}"?</h2>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
