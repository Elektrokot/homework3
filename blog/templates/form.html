{% extends 'base.html' %}

{% block title %}{% if object %}Редактировать{% else %}Создать{% endif %} запись{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center">{% if object %}Редактировать{% else %}Создать{% endif %} запись</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
{% endblock %}
