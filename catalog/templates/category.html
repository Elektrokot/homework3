{% extends 'base.html' %}

{% block title %}Категории{% endblock %}

{% block content %}
<h1 class="text-center fw-bold mt-5">Категории</h1>

<div class="row mt-3">
    {% for category in categories %}
    <div class="col-4 mt-5">
        <div class="card">
          <div class="card-header">
            <h2 class="text-center">{{ category.name }}</h2>
          </div>
          <div class="card-body">
            <p class="card-text text-center">{{ category.description|truncatechars:100 }}</p>
            <a href="{% url 'catalog:category_detail' category.pk %}" class="btn btn-outline-primary w-100">Перейти</a>
          </div>
        </div>
    </div>
    {% empty %}
    <p class="text-center">Нет доступных категорий.</p>
    {% endfor %}
</div>
{% endblock %}
