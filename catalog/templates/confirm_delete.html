{% extends 'base.html' %}

{% block title %}Удалить товар?{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center">Вы уверены, что хотите удалить "{{ object.title }}"?</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:catalog' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
